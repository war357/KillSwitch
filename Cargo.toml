[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/agent",
    "crates/server",
    "crates/wipe-partition",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/yourorg/remote-wipe"
authors = ["Remote Wipe Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-rustls = "0.25"
rustls = "0.22"

# Web framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = "0.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid"] }

# Crypto and security
totp-rs = "5.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
ring = "0.17"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.4", features = ["derive"] }